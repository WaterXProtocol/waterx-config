name: Validate config

# Every PR: instances must satisfy the schema of the shape they declare, the
# lift must stay lossless, keyspace/field drift must be declared, the repo
# must be flip-coherent, and both parsers must parse both instances. Mark
# these jobs required in the ruleset.
on:
  pull_request:
  push:
    branches: [main, staging, main-v2, staging-v2]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    name: schema-consistency-and-ts-parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: packages/ts/package-lock.json }
      - run: cd packages/ts && npm ci
      - name: Instances match their shape's schema; lift is lossless
        run: |
          export PATH="$PWD/packages/ts/node_modules/.bin:$PATH"
          ajv validate --spec=draft2020 -s schema/waterx-config.schema.json -d mainnet.json -d testnet.json
          node scripts/derive-target.mjs emit .build-target
          ajv validate --spec=draft2020 -s schema/waterx-config-target.schema.json -d ".build-target/*.json"
      - name: Consistency + flip coherence
        run: |
          node scripts/check-consistency.mjs
          node scripts/check-flip-state.mjs
      - name: TS parser tests + typecheck
        run: cd packages/ts && npm test && npx tsc -p . --noEmit

  rust-parser:
    name: rust-parser-parses-instances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: packages/rust }
      - name: Emit node lift output for the cross-language drift guard
        run: node scripts/derive-target.mjs emit .build-target
      - run: cd packages/rust && cargo test
