name: Validate config

# Every PR: both instances must satisfy the schema, every keyspace/field drift
# must be declared in schema/coverage-exceptions.json, and both generated
# parsers must still parse both instances. Mark all three jobs required in the
# branch ruleset — this is what makes the schema the SSOT instead of a wish.
on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  schema:
    name: instances-match-schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npx --yes ajv-cli@5 validate --spec=draft2020 -s schema/waterx-config.schema.json -d mainnet.json
      - run: npx --yes ajv-cli@5 validate --spec=draft2020 -s schema/waterx-config.schema.json -d testnet.json
      - name: Keyspace + drift consistency (v1 + v2)
        run: node scripts/check-consistency.mjs
      - name: v2 derivation is lossless and valid
        run: |
          node scripts/derive-v2.mjs mainnet
          node scripts/derive-v2.mjs testnet
          git diff --exit-code -- v2/ deploys/
          npx --yes ajv-cli@5 validate --spec=draft2020 -s schema/v2/waterx-config-v2.schema.json -d v2/mainnet.json
          npx --yes ajv-cli@5 validate --spec=draft2020 -s schema/v2/waterx-config-v2.schema.json -d v2/testnet.json

  ts-parser:
    name: ts-parser-parses-instances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd packages/ts && npm ci && npm test && npx tsc -p .

  rust-parser:
    name: rust-parser-parses-instances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cd packages/rust && cargo test
