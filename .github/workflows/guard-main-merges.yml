name: Guard main merges

# Only staging may be merged into main. PRs from any other source branch fail.
# Mark this check as required in the main ruleset so a failure blocks the merge.
on:
  pull_request:
    branches: [main]

jobs:
  guard-source-branch:
    name: only-staging-can-merge
    runs-on: ubuntu-latest
    steps:
      - name: Ensure PR source is staging
        env:
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$SOURCE_REPOSITORY" != "WaterXProtocol/waterx-config" ] || [ "$SOURCE_BRANCH" != "staging" ]; then
            echo "::error::Only WaterXProtocol/waterx-config:staging may be merged into main. This PR is from $SOURCE_REPOSITORY:$SOURCE_BRANCH."
            exit 1
          fi
          echo "Source branch $SOURCE_REPOSITORY:$SOURCE_BRANCH is allowed."
