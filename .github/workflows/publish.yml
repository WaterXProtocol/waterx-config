name: Publish packages

# Publishes @waterx-protocol/config to npm on a version tag (v*). The Rust
# crate needs no registry step: Cargo consumes it straight from the git tag
# (subdirectory packages are supported natively) —
#   waterx-config = { git = "https://github.com/WaterXProtocol/waterx-config", tag = "v0.1.0" }
#
# Requires the NPM_TOKEN repo secret (org automation token with publish rights
# on @waterx-protocol). Until it exists this workflow fails with a clear
# message rather than half-publishing.
on:
  push:
    tags: ["v*"]

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to publish without a token
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "::error::NPM_TOKEN secret is not set — create an org automation token with publish rights on @waterx-protocol and add it to this repo's secrets."
            exit 1
          fi
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: packages/ts/package-lock.json, registry-url: "https://registry.npmjs.org" }
      - name: Tag commit must be on main (no publishing unmerged code)
        run: |
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME points at a commit not on main — merge first, then tag."
            exit 1
          fi
      - name: Tag must match package version
        run: |
          PKG=$(node -p "require('./packages/ts/package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag v$TAG != packages/ts version $PKG — bump package.json in the same PR as the tag."
            exit 1
          fi
      # tests already gated the merge (validate.yml); the tag gate above is the publish gate
      - run: cd packages/ts && npm ci && npm run build
      - run: cd packages/ts && npm publish --access public
        env: { NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}" }
